<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toque  Huella">
  <title>Toque  Huella</title>
  <!-- Anillos segmentados: la huella del dedo sobre la pantalla -->
  <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
    <circle cx="50" cy="50" r="10" stroke-dasharray="46 16.83" transform="rotate(-100 50 50)"/>
    <circle cx="50" cy="50" r="17" stroke-dasharray="74 32.8" transform="rotate(30 50 50)"/>
    <circle cx="50" cy="50" r="24" stroke-dasharray="58 18 56 18.8" transform="rotate(-50 50 50)"/>
    <circle cx="50" cy="50" r="31" stroke-dasharray="118 22 32 22.8" transform="rotate(140 50 50)" opacity="0.65"/>
  </g>
  <!-- El toque -->
  <circle cx="50" cy="50" r="4.5" fill="var(--toque-accent, currentColor)"/>
</svg>
