<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toque  Moneda">
  <title>Toque  Moneda</title>
  <defs>
    <mask id="toque-moneda-mask">
      <rect width="100" height="100" fill="black"/>
      <circle cx="50" cy="50" r="34" fill="white"/>
      <!-- Tres toques perforados, subiendo -->
      <circle cx="35" cy="61" r="4.5" fill="black"/>
      <circle cx="50" cy="50" r="6" fill="black"/>
      <circle cx="66" cy="38" r="8" fill="black"/>
    </mask>
  </defs>
  <!-- Canto de la moneda -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="var(--toque-accent, currentColor)" stroke-width="2.5" stroke-dasharray="0.5 5" stroke-linecap="round" opacity="0.7"/>
  <!-- La caja del día -->
  <circle cx="50" cy="50" r="34" fill="currentColor" mask="url(#toque-moneda-mask)"/>
</svg>
