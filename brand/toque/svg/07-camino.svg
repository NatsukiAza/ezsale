<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toque  Camino">
  <title>Toque  Camino</title>
  <!-- Eco alrededor del último toque: listo -->
  <circle cx="76" cy="32" r="15" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.4"/>
  <circle cx="76" cy="32" r="21" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="0.5 6" stroke-linecap="round" opacity="0.35"/>
  <!-- Producto ’ medio de pago: pendiente, punteado -->
  <path d="M 24 68 C 40 68, 34 50, 50 50" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.5 7"/>
  <!-- Medio de pago ’ listo: resuelto, sólido -->
  <path d="M 50 50 C 66 50, 60 32, 76 32" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Los tres toques -->
  <g fill="currentColor">
    <circle cx="24" cy="68" r="5"/>
    <circle cx="50" cy="50" r="6.5"/>
  </g>
  <circle cx="76" cy="32" r="8.5" fill="var(--toque-accent, currentColor)"/>
</svg>
