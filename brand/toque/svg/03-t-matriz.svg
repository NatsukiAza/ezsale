<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toque  T Matriz">
  <title>Toque  T Matriz</title>
  <!-- Grilla de fondo: la pantalla -->
  <g fill="currentColor" opacity="0.18">
    <circle cx="20" cy="34" r="1.8"/><circle cx="34" cy="34" r="1.8"/><circle cx="62" cy="34" r="1.8"/><circle cx="76" cy="34" r="1.8"/>
    <circle cx="20" cy="48" r="1.8"/><circle cx="34" cy="48" r="1.8"/><circle cx="62" cy="48" r="1.8"/><circle cx="76" cy="48" r="1.8"/>
    <circle cx="20" cy="62" r="1.8"/><circle cx="34" cy="62" r="1.8"/><circle cx="62" cy="62" r="1.8"/><circle cx="76" cy="62" r="1.8"/>
    <circle cx="20" cy="76" r="1.8"/><circle cx="34" cy="76" r="1.8"/><circle cx="62" cy="76" r="1.8"/><circle cx="76" cy="76" r="1.8"/>
  </g>
  <!-- La T, construida en módulos -->
  <g fill="currentColor">
    <rect x="15" y="15" width="10" height="10" rx="3"/>
    <rect x="29" y="15" width="10" height="10" rx="3"/>
    <rect x="43" y="15" width="10" height="10" rx="3"/>
    <rect x="57" y="15" width="10" height="10" rx="3"/>
    <rect x="71" y="15" width="10" height="10" rx="3"/>
    <rect x="43" y="29" width="10" height="10" rx="3"/>
    <rect x="43" y="43" width="10" height="10" rx="3"/>
    <rect x="43" y="57" width="10" height="10" rx="3"/>
  </g>
  <!-- El último módulo es el toque -->
  <circle cx="48" cy="76" r="5.5" fill="var(--toque-accent, currentColor)"/>
</svg>
